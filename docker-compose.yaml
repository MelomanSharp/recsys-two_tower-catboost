version: '3.8'

services:
  fastapi_server:
    build:
      context: .
      dockerfile: docker/app.Dockerfile
    ports:
      - "8000:8000"
    environment:
      - REDIS_HOST=redis_cache
      - REDIS_PORT=6379
      - POSTGRES_URI=postgresql://admin:admin@postgres_db:5432/recsys_db
    depends_on:
      - redis_cache
      - postgres_db

  redis_cache:
    image: redis:7.0-alpine
    ports:
      - "6379:6379"

  postgres_db:
    image: postgres:15-alpine
    environment:
      - POSTGRES_USER=admin
      - POSTGRES_PASSWORD=admin
      - POSTGRES_DB=recsys_db
    ports:
      - "5432:5432"
